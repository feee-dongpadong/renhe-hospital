*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",Arial,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
svg{display:block}
.app{
  max-width:1440px;
  margin:22px auto 44px;
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 18px rgba(55,48,36,.08);
  min-height:calc(100vh - 66px);
  display:flex;
  flex-direction:column;
}
.hd{
  display:flex;
  align-items:center;
  gap:38px;
  padding:0 40px;
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--line-soft);
  flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:11px}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-cn{font-size:20px;font-weight:600;letter-spacing:.5px}
.brand-en{font-size:8.5px;letter-spacing:1.7px;color:#44505C;margin-top:2px}
.nav{display:flex;gap:38px;margin:0 auto;height:68px}
.nav a{display:flex;align-items:center;position:relative;font-size:15.5px;color:#33373C}
.nav a.on{color:var(--primary);font-weight:600}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:15px;height:2.5px;border-radius:2px;background:var(--primary)}
.user{display:flex;align-items:center;gap:10px;font-size:14px;color:#3B3F45;position:relative;cursor:pointer;padding:8px 0}

const API_BASE = '';

async function api(path, options = {}) {
  let res;
  try {
    res = await fetch(API_BASE + path, {
      credentials:'same-origin',
      headers:{ 'Content-Type':'application/json' },
      ...options
    });
  } catch (e) {
    throw new Error('无法连接服务，请确认后端已启动');
  }
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok || !body || body.code !== 0) {
    throw new Error(body && body.message ? body.message : '请求失败，请稍后重试');
  }
  return body.data;
}

function maskId(v) {
  if (!v) return '';
  return v.length > 7 ? v.slice(0, 3) + '*'.repeat(11) + v.slice(-4) : v;
}

  state.userInfo = user;

    PATIENTS[0].idNo = maskId(user.idCard);
    PATIENTS[0].phone = user.phone || PATIENTS[0].phone;
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function setByPath(obj, path, val) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = val;
}

function violationStats(patientId) {
  const all = APPTS.filter(a => a.patientId === patientId && a.status === '已违约')
    .map(a => ({ ...a, dt:parseMD(a.date) }))
    .sort((a, b) => a.dt - b.dt);
  const now = nowDate();
  const cutoff = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate());
  const recent = all.filter(v => v.dt > cutoff);
  const black = recent.length > 3;
  const removal = black ? addMonths(recent[recent.length - 4].dt, 3) : null;
  return { count:recent.length, total:all.length, black, removal, recent, all };
}

const AM_TIMES = ['08:00','08:30','09:00','09:30','10:00','10:30','11:00'];
const PM_TIMES = ['14:00','14:30','15:00','15:30'];

function slotData(md, period, docId) {
  const doc = doctorById(docId || state.doctorId);
  const day = doc.days.find(d => d.md === md);
  const times = period === '上午' ? AM_TIMES : PM_TIMES;
  if (!day) {
    const g = SLOTS[md];
    if (!g) return { rest:'已约满', slots:times.map(t => [t, false]) };
    return period === '上午' ? g.am : g.pm;
  }
  const count = period === '上午' ? day.am : day.pm;
  let flags;
  if (doc.id === 'd1' && md === '11-24' && period === '上午') flags = times.map(t => !['10:30','11:00'].includes(t));
  else flags = times.map((t, i) => i < Math.min(count, times.length));
  return { rest:count > 0 ? `剩余 ${count} 个号` : '已约满', slots:times.map((t, i) => [t, flags[i]]) };
}

function firstSlot(md, period, docId) {
  const hit = slotData(md, period, docId).slots.find(s => s[1]);
  return hit ? hit[0] : '';
}

}

function stepsBar(n) {
  const labels = ['选择科室','选择医生','选择时间','确认预约'];
  let html = '<div class="steps">';
  labels.forEach((label, i) => {
    const idx = i + 1;
    html += `<div class="step ${idx <= n ? 'on' : ''}"><span class="no">${idx}</span><span>${label}</span></div>`;
    if (i < labels.length - 1) html += `<div class="step-line ${idx < n ? 'on' : ''}"></div>`;
  });
  return html + '</div>';
}

function qrSvg(seed) {
  const n = 21;
  let s = 0;
  for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  let rects = '';
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const inFinder = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
      if (inFinder) continue;
      s = (s * 1103515245 + 12345) >>> 0;
      if (((s >>> 16) % 100) < 46) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;
    }
  }
  return `<svg class="qr" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="21" height="21" fill="#fff"/>${finder(0,0)}${finder(14,0)}${finder(0,14)}${rects}</svg>`;
}

          ? '<div class="report-wait">报告正在审核中，预计 11-24 出具</div>'
          : `<table class="report-table">
              <thead><tr><th>项目</th><th>${r.cat === '检查' ? '所见' : '结果'}</th>${r.cat === '检查' ? '' : '<th>参考范围</th>'}<th>提示</th></tr></thead>
              <tbody>${r.items.map(([n, v, range, tip]) => `<tr><td>${n}</td><td class="${tip ? 'hi' : ''}">${v}</td>${r.cat === '检查' ? '' : `<td>${range}</td>`}<td class="${tip ? 'hi' : ''}">${tip || '—'}</td></tr>`).join('')}</tbody>
            </table>
            <div class="conclusion">${r.conclusion}</div>`
        }
      </div>
      <div class="modal-ft"><button class="btn ghost" data-action="closeModal">关闭</button></div>
    </div>
  </div>`;
}

function payModal() {
  const b = BILLS.find(x => x.id === state.modal.id);
  const p = patientById(b.patientId);
  return `<div class="overlay">
    <div class="modal sm">
      <div class="modal-hd"><h3>支付确认</h3><button class="x" data-action="closeModal">${icon('x',20)}</button></div>
      <div class="modal-bd">
        <div class="pay-card">
          <div class="pay-line"><span>${b.title}</span><span>¥${b.amount.toFixed(2)}</span></div>
          <div class="pay-line"><span>就诊人</span><span>${p ? p.name : ''}</span></div>
          <div class="pay-line"><span>就诊日期</span><span>${b.date}</span></div>
          <div class="pay-line total"><span>应付金额</span><span class="amt">¥${b.amount.toFixed(2)}</span></div>
        </div>
        <div class="label" style="margin-top:2px">支付方式</div>
        <div class="pay-ways">
          ${['微信支付','支付宝'].map(m => `<div class="pay-way ${state.payMethod === m ? 'on' : ''}" data-action="payMethod" data-v="${m}"><span class="radio"></span><span>${m}</span><span class="way-ic">${m === '微信支付' ? '推荐' : ''}</span></div>`).join('')}
        </div>
        <div class="rule-note">支付成功后可在“已缴费”中查看记录，费用明细以院内结算为准。</div>
      </div>
      <div class="modal-ft">
        <button class="btn ghost" data-action="closeModal">取消</button>
        <button class="btn" data-action="confirmPay" data-id="${b.id}">确认支付 ¥${b.amount.toFixed(2)}</button>
      </div>
    </div>
  </div>`;
}

function ruleModal() {
  const p = patientById('p2');
  const s = violationStats('p2');
  const s1 = violationStats('p1');
  const rows = [...s.recent].sort((a, b) => b.dt - a.dt);
  const removed = state.demoPlus3 && !s.black && s.total > 0;
  return `<div class="overlay">
    <div class="modal md">
      <div class="modal-hd"><h3>预约黑名单规则</h3><button class="x" data-action="closeModal">${icon('x',20)}</button></div>
      <div class="modal-bd">
        <ol class="rule-ol">
          <li>预约成功后未按时到院就诊，记为 1 次违约。</li>
          <li>3 个月内累计违约超过 3 次，该就诊人加入黑名单，暂停预约。</li>
          <li>加入黑名单后满 3 个月且期间无新增违约，自动解除，可正常预约。</li>
          <li>违约记录按自然日滚动计算，超过 3 个月的记录不再计入。</li>
        </ol>
        <div class="rule-block">
          <h4>当前判定 · ${fmtDate(nowDate())}</h4>
          <div class="rule-status ${s.black ? '' : 'ok'}">
            <span class="strong">${p.name}</span>
            <div>${s.black
              ? `已加入黑名单：近 3 个月违约 ${s.count} 次，预计 ${fmtDate(s.removal)} 自动解除。`
              : removed
                ? `已满 3 个月无新增违约，自动移出黑名单，可正常预约。`
                : `未在黑名单：近 3 个月违约 ${s.count} 次，可正常预约。`}</div>
          </div>
          ${rows.length ? `<div class="vio-list">${rows.map(v => `<div class="vio-row"><span>${v.date} ${dateInfo(v.date).week} ${v.period} ${v.time} · ${v.dept}</span><span class="d">违约</span></div>`).join('')}</div>` : ''}
          <div class="rule-note">李女士近 3 个月违约 ${s1.count} 次，可正常预约。黑名单仅限制该就诊人预约，其他家庭成员不受影响。</div>
        </div>
      </div>
      <div class="modal-ft">
        <button class="btn ghost" data-action="closeModal">关闭</button>
        <button class="btn soft" data-action="timeShift">${state.demoPlus3 ? '恢复当前时间' : '演示：快进 3 个月'}</button>
      </div>
    </div>
  </div>`;
}

function viewHtml() {
  switch (state.view) {
    case 'login': return loginView();
    case 'register': return registerView();
    case 'doctors': return doctorsView();
    case 'time': return timeView();
    case 'confirm': return confirmView();
    case 'success': return successView();
    case 'appts': return apptsView();
    case 'about': return aboutView();
    case 'guide': return guideView();
    case 'reports': return reportsView();
    case 'payments': return paymentsView();
    default: return homeView();
  }
}

function render() {
  let html = viewHtml();
  if (state.modal === 'patient') html += patientModal();
  if (state.modal && state.modal.type === 'cancel') html += cancelModal();
  if (state.modal && state.modal.type === 'report') html += reportModal();
  if (state.modal && state.modal.type === 'pay') html += payModal();
  if (state.modal && state.modal.type === 'rule') html += ruleModal();
  document.getElementById('app').innerHTML = html;
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function go(view, patch) {
  Object.assign(state, patch || {});
  if (!state.loggedIn && view !== 'login' && view !== 'register') view = 'login';
  state.view = view;
  state.modal = null;
  state.menu = false;
  if (view === 'home') state.search = '';
  if (view === 'doctors' && !(patch && Object.prototype.hasOwnProperty.call(patch, 'search'))) state.search = '';
  render();
  window.scrollTo(0, 0);
}

function doSearch() {
  state.search = state.search.trim();
  state.view = 'doctors';
  state.menu = false;
  render();
  window.scrollTo(0, 0);
}

function selectDoctor(id) {
  const doc = doctorById(id);
  const d = doc.days[0];
  const am = firstSlot(d.md, '上午', id);
  const pm = firstSlot(d.md, '下午', id);
  state.doctorId = id;
  state.date = d.md;
  if (am) { state.period = '上午'; state.time = am; }
  else if (pm) { state.period = '下午'; state.time = pm; }
  else { state.period = '上午'; state.time = ''; }
}

function pickDate(md) {
  const d = dateInfo(md);
  if (d.off) return;
  state.date = md;
  const am = firstSlot(md, '上午');
  const pm = firstSlot(md, '下午');
  if (am) { state.period = '上午'; state.time = am; }
  else if (pm) { state.period = '下午'; state.time = pm; }
  else { state.time = ''; }
  render();
}

async function doLogin() {
  const err = {};
  if (state.loginTab === 'pwd') {
    if (!state.login.account.trim()) err.account = '请输入手机号或身份证号';
    if (!state.login.password) err.password = '请输入密码';
  } else {
    state.loginErr = { form:'短信验证码登录暂未开通，请使用账号密码登录' };
    render();
    return;
  }
  state.loginErr = err;
  if (Object.keys(err).length) { render(); return; }
  state.loginLoading = true;
  render();
  try {
    const user = await api('/api/auth/login', {
      method:'POST',
      body: JSON.stringify({
        account: state.login.account.trim(),
        password: state.login.password,
        remember: state.login.remember
      })
    });
    state.loginLoading = false;
    applyUser(user);
    state.loginErr = {};
    go('home');
    toast('登录成功，欢迎回来');
  } catch (e) {
    state.loginLoading = false;
    state.loginErr = { form:e.message };
    render();
  }
}

async function doRegister() {
  const f = state.register;
  const err = {};
  if (!f.name.trim()) err.name = '请输入姓名';
  else if (f.name.trim().length < 2 || f.name.trim().length > 20) err.name = '姓名长度为 2-20 个字符';
  if (!/^1[3-9]\d{9}$/.test(f.phone.trim())) err.phone = '请输入正确的手机号';
  if (!/^[1-9]\d{16}[\dXx]$/.test(f.idCard.trim())) err.idCard = '请输入 18 位身份证号';
  if (!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*?&._-]{8,20}$/.test(f.password)) err.password = '密码需为 8-20 位并同时包含字母和数字';
  if (f.password !== f.confirmPassword) err.confirmPassword = '两次输入的密码不一致';
  if (!f.agree) err.agree = '请先阅读并同意《预约挂号须知》';
  state.registerErr = err;
  if (Object.keys(err).length) { render(); return; }
  state.registerLoading = true;
  render();
  try {
    await api('/api/auth/register', {
      method:'POST',
      body: JSON.stringify({
        name:f.name.trim(),
        phone:f.phone.trim(),
        idCard:f.idCard.trim(),
        password:f.password,
        confirmPassword:f.confirmPassword
      })
    });
    state.registerLoading = false;
    state.login.account = f.phone.trim();
    state.login.password = '';
    state.loginTab = 'pwd';
    state.register = { name:'', phone:'', idCard:'', password:'', confirmPassword:'', agree:false };
    state.registerErr = {};
    state.view = 'login';
    render();
    window.scrollTo(0, 0);
    toast('注册成功，请使用新账号登录');
  } catch (e) {
    state.registerLoading = false;
    state.registerErr = { form:e.message };
    render();
  }
}

async function logout() {
  try { await api('/api/auth/logout', { method:'POST' }); } catch (e) {}
  state.loggedIn = false;
  state.userInfo = null;
  state.user = '';
  state.view = 'login';
  state.menu = false;
  state.loginLoading = false;
  state.loginErr = {};
  render();
  window.scrollTo(0, 0);
  toast('已退出登录');
}

function createOrder() {
  const doc = doctorById(state.doctorId);
  const no = 'YY20261124' + String(state.seq).padStart(5, '0');
  state.seq += 1;
  const order = {
    no, doctorId:doc.id, patientId:state.patientId, dept:doc.dept,
    date:state.date, period:state.period, time:state.time, fee:doc.fee, status:'待就诊',
    loc:doc.loc, locHint:doc.locHint, locDetail:doc.locDetail
  };
  APPTS.unshift(order);
  return order;
}

function savePatient() {
  const f = state.patientForm;
  const err = {};
  if (!f.name.trim()) err.name = '请输入就诊人姓名';
  if (!f.idNo.trim()) err.idNo = '请输入证件号码';
  if (!f.phone.trim()) err.phone = '请输入手机号';
  else if (!/^1\d{10}$/.test(f.phone.trim())) err.phone = '请输入正确的手机号';
  f.errors = err;
  if (Object.keys(err).length) { render(); return; }
  const raw = f.idNo.trim();
  const masked = raw.length > 8 ? raw.slice(0,3) + '*'.repeat(11) + raw.slice(-4) : raw;
  const p = { id:'p' + (PATIENTS.length + 1), name:f.name.trim(), rel:f.rel, idType:f.idType, idNo:masked };
  PATIENTS.push(p);
  state.patientId = p.id;
  state.patientForm = null;
  state.modal = null;
  render();
  toast('就诊人已保存');
}

document.getElementById('app').addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (state.menu) { state.menu = false; render(); }
    return;
  }
  const a = el.dataset.action;
  const ds = el.dataset;
  switch (a) {
    case 'go': go(ds.view); break;
    case 'userMenu': {
      state.menu = !state.menu;
      render();
      break;
    }
    case 'toLogin': {
      logout();
      break;
    }
    case 'doSearch': doSearch(); break;
    case 'quick': {
      if (ds.key === 'book') go('doctors');
      else if (ds.key === 'appts') go('appts');
      else if (ds.key === 'reports') go('reports');
      else if (ds.key === 'pay') go('payments');
      break;
    }
    case 'allDepts': go('doctors'); break;
    case 'homeDept': go('doctors', { dept:ds.dept, search:'' }); break;
    case 'sideDept': state.dept = ds.dept; state.search = ''; render(); break;
    case 'sort': state.sort = ds.key; render(); break;
    case 'bookDoctor': {
      selectDoctor(ds.id);
      go('time');
      break;
    }
    case 'pickChip': {
      selectDoctor(ds.id);
      state.date = ds.md;
      state.period = ds.period;
      state.time = firstSlot(ds.md, ds.period);
      go('time');
      break;
    }
    case 'changeDoc': go('doctors'); break;
    case 'pickDate': pickDate(ds.md); break;
    case 'pickSlot': {
      state.period = ds.period;
      state.time = ds.time;
      render();
      break;
    }
    case 'next': {
      if (!state.time) { toast('请选择就诊时段'); return; }
      go('confirm');
      break;
    }
    case 'pickPatient': state.patientId = ds.id; render(); break;
    case 'openPatient': {
      state.patientForm = { name:'', idType:'居民身份证', idNo:'', phone:'', rel:'本人', openSelect:false, errors:{} };
      state.modal = 'patient';
      render();
      break;
    }
    case 'closeModal': state.modal = null; state.patientForm = null; render(); break;
    case 'selectToggle': state.patientForm.openSelect = !state.patientForm.openSelect; render(); break;
    case 'pickIdType': state.patientForm.idType = ds.v; state.patientForm.openSelect = false; render(); break;
    case 'pickRel': state.patientForm.rel = ds.v; render(); break;
    case 'savePatient': savePatient(); break;
    case 'toggleAgree': state.agree = !state.agree; render(); break;
    case 'rules': toast('预约挂号须知：请按预约时段提前 15 分钟到院'); break;
    case 'backToTime': go('time'); break;
    case 'pay': {
      if (!state.patientId) { toast('请选择就诊人'); return; }
      const payPatient = patientById(state.patientId);
      if (payPatient && violationStats(payPatient.id).black) { toast(`${payPatient.name} 已被加入黑名单，暂不能预约`); return; }
      if (!state.agree) { toast('请先阅读并同意《预约挂号须知》'); return; }
      state.lastOrder = createOrder();
      state.justBooked = true;
      state.apptTab = '待就诊';
      go('success');
      toast('预约成功，请按时到院就诊');
      break;
    }
    case 'apptTab': state.apptTab = ds.tab; render(); break;
    case 'cancelAppt': state.modal = { type:'cancel', id:ds.id }; render(); break;
    case 'confirmCancel': {
      const appt = APPTS.find(x => x.no === ds.id);
      if (appt) appt.status = '已取消';
      state.modal = null;
      render();
      toast('预约已取消，号源已释放');
      break;
    }
    case 'voucher': {
      const appt = APPTS.find(x => x.no === ds.id);
      if (appt) { state.lastOrder = appt; state.justBooked = false; go('success'); }
      break;
    }
    case 'navigate': toast('正在打开地图导航，请稍候…'); break;
    case 'rebook': {
      const a = APPTS.find(x => x.no === ds.id);
      if (a) go('doctors', { dept:a.dept });
      else go('doctors');
      break;
    }
    case 'noticeMore': toast('更多停诊通知请关注医院公告'); break;
    case 'aboutDept': state.dept = ds.dept; render(); break;
    case 'aboutBook': go('doctors', { dept:ds.dept }); break;
    case 'reportTab': state.reportTab = ds.tab; render(); break;
    case 'openReport': state.modal = { type:'report', id:ds.id }; render(); break;
    case 'billTab': state.billTab = ds.tab; render(); break;
    case 'openPay': state.modal = { type:'pay', id:ds.id }; render(); break;
    case 'payMethod': state.payMethod = ds.v; render(); break;
    case 'confirmPay': {
      const b = BILLS.find(x => x.id === ds.id);
      if (!b) return;
      b.status = '已缴费';
      state.modal = null;
      state.billTab = '已缴费';
      render();
      toast('支付成功，缴费记录已更新');
      break;
    }
    case 'rule': state.modal = { type:'rule' }; render(); break;
    case 'timeShift': {
      state.demoPlus3 = !state.demoPlus3;
      render();
      toast(state.demoPlus3 ? '已模拟 3 个月后，黑名单状态已更新' : '已恢复当前时间');
      break;
    }
    case 'loginTab': {
      state.loginTab = ds.tab;
      state.loginErr = {};
      render();
      break;
    }
    case 'toggleRemember': state.login.remember = !state.login.remember; render(); break;
    case 'forgot': toast('请携带证件到门诊服务台重置密码'); break;
    case 'sendCode': toast('验证码已发送，演示验证码为 8888'); break;
    case 'wechatLogin': toast('演示环境暂未开通微信登录，请使用账号密码登录'); break;
    case 'register': {
      state.registerErr = {};
      state.view = 'register';
      state.menu = false;
      render();
      window.scrollTo(0, 0);
      break;
    }
    case 'toLoginView': {
      state.view = 'login';
      state.loginErr = {};
      state.registerErr = {};
      render();
      window.scrollTo(0, 0);
      break;
    }
    case 'toggleRegAgree': {
      state.register.agree = !state.register.agree;
      if (state.registerErr.agree) delete state.registerErr.agree;
      render();
      break;
    }
    default: break;
  }
});

document.getElementById('app').addEventListener('click', (e) => {
  const ov = e.target.classList && e.target.classList.contains('overlay');
  if (ov) { state.modal = null; state.patientForm = null; render(); }
});

document.getElementById('app').addEventListener('input', (e) => {
  const el = e.target.closest('[data-model]');
  if (!el) return;
  setByPath(state, el.dataset.model, el.value);
});

document.getElementById('app').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter === 'search') {
    e.preventDefault();
    doSearch();
  }
});

document.getElementById('app').addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.dataset.form === 'login') doLogin();
  if (e.target.dataset.form === 'register') doRegister();
});

async function boot() {
  try {
    const user = await api('/api/auth/me');
    applyUser(user);
    state.view = 'home';
  } catch (e) {
    state.loggedIn = false;
    state.view = 'login';
  }
  state.authChecked = true;
  render();
}

boot();
</script>
</body>
</html>
